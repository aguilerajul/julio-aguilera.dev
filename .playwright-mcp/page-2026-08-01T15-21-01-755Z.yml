          - heading "Keeping strangers out" [level=3] [ref=f3e83]
          - paragraph [ref=f3e84]: Authentication that has to be right every single time, for everyone, forever. I've done the whole passkey ceremony end to end and read the spec when the tutorials disagreed.
          - generic [ref=f3e85]: WebAuthn · Fido2NetLib · OAuth
        - generic [ref=f3e86]:
          - heading "Choosing where data lives" [level=3] [ref=f3e88]
          - paragraph [ref=f3e89]: Access patterns before schemas. Key-value or relational on the merits, hybrid when the honest answer is both, and migrations that finish without a maintenance window.
          - generic [ref=f3e90]: DynamoDB · Aurora · SQL
        - generic [ref=f3e91]:
          - heading "Putting out the fire" [level=3] [ref=f3e93]
          - paragraph [ref=f3e94]: Deploys, rollbacks, and knowing which one to reach for at 3am. Reading logs at volume until the story makes sense, then writing down what happened so it doesn't happen twice.
          - generic [ref=f3e95]: Rollbacks · log forensics · KQL
        - generic [ref=f3e96]:
          - heading "Building the thing itself" [level=3] [ref=f3e98]
          - paragraph [ref=f3e99]: I make small games on my own time. It's why I understand what the backend is actually holding up - and why I argue about latency budgets like they're personal.
