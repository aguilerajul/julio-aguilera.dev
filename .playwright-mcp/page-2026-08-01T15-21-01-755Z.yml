        - generic [ref=f3e27]: AWS & distributed systems
        - generic [ref=f3e28]: MSc Video Game Development
        - generic [ref=f3e29]: Unity Certified
        - generic [ref=f3e30]: EN / ES
    - generic [ref=f3e31]:
      - paragraph [ref=f3e32]: The long run
      - heading "Twenty years, one stop at a time" [level=2] [ref=f3e33]
      - paragraph [ref=f3e34]: Not a straight line, and not supposed to be. Every stop taught me something the next one needed.
      - generic [ref=f3e35]:
        - generic [ref=f3e36]:
          - generic [ref=f3e37]: 2006 - 2012
          - heading ".NET Software Developer" [level=3] [ref=f3e38]
          - generic [ref=f3e39]: WAU · Caracas, Venezuela
          - paragraph [ref=f3e40]: "Six years selling mobile content: carrier integrations, WAP and web apps, and the reporting that proved the subscription numbers were real. First lesson of my career - a system is only as reliable as the integration you don't control."
        - generic [ref=f3e41]:
          - generic [ref=f3e42]: 2013 - 2016
          - heading "Senior Software Engineer" [level=3] [ref=f3e43]
          - generic [ref=f3e44]: Mahisoft · Venezuela / Madrid
          - paragraph [ref=f3e45]: The years I crossed the Atlantic. DocuSign e-signature into ChannelSoft's CMS, and listings work for Homesearch and Ten-x. Two continents in the same standup, which teaches you to write things down.
        - generic [ref=f3e46]:
          - generic [ref=f3e47]: 2016 - 2017
          - heading "Senior Solutions Developer" [level=3] [ref=f3e48]
          - generic [ref=f3e49]: Quodem · Madrid
          - paragraph [ref=f3e50]: A WPF point-of-sale so pharmacists could build their own promotions, and a conferencing platform for doctors running medical congresses. Two domains I knew nothing about, which is the fastest way to learn to ask better questions.
        - generic [ref=f3e51]:
          - generic [ref=f3e52]: 2016 - 2018
          - heading "MSc, Video Game Development with Unity 3D" [level=3] [ref=f3e53]
          - generic [ref=f3e54]: CICE · Madrid
          - paragraph [ref=f3e55]: Evenings and weekends, learning the craft I'd only ever served from the backend. Unity stuck and never left.
        - generic [ref=f3e56]:
          - generic [ref=f3e57]: 2017 - 2019
          - heading "Senior Backend Developer" [level=3] [ref=f3e58]
          - generic [ref=f3e59]: NIIT Technologies · Madrid
          - paragraph [ref=f3e60]: A trips importer for seasonal travel content, and drag-and-drop page modules in Sitecore so content managers stopped filing a ticket every time they wanted to move a block.
        - generic [ref=f3e61]:
          - generic [ref=f3e62]: 2019 - 2021
          - heading "Senior Backend Engineer, then Mobile Developer" [level=3] [ref=f3e63]
          - generic [ref=f3e64]: Cognizant · Madrid
          - paragraph [ref=f3e65]: Tech lead representative for the Madrid backend team on a used-car-lease microservice, then a Xamarin app that let dairy farmers check production across their sites. Different worlds, same DDD habits.
        - generic [ref=f3e66]:
          - generic [ref=f3e67]: 2021 - now
          - heading "Senior Backend Engineer, Online Services" [level=3] [ref=f3e68]
          - generic [ref=f3e69]: Ubisoft · Barcelona
          - paragraph [ref=f3e70]: "Three chapters in five years: an early Ubisoft Connect initiative that never reached production, the Rainbow Six Siege reputation system backend on AWS, and for the last two the Account team - user profiles, authentication, TFA, passkeys, SSO, and account linking with Steam and Blacknut. I don't carry a lead title; I carry the POCs, the spikes and the ADRs."
        - generic [ref=f3e71]:
          - generic [ref=f3e72]: Evenings
          - heading "Novrix Labs" [level=3] [ref=f3e73]
          - generic [ref=f3e74]: My own thing · Okmaya
          - paragraph [ref=f3e75]: Where I build games and tools nobody asked for, which is exactly why they're fun. I model and texture a fair amount of it myself - the art lives on ArtStation and Sketchfab, the builds on itch.io. Knowing how the asset was made changes how you argue about what the backend should carry.
