    - generic [ref=f3e20]:
      - paragraph [ref=f3e21]: Barcelona · Backend engineer
      - heading "Hi, I'm Julio. I build the half of the game nobody sees." [level=1] [ref=f3e22]
      - paragraph [ref=f3e23]: Twenty years writing backends. These days, the online services behind a live AAA shooter - the accounts, the logins, the data underneath. When it works, nobody notices. That's the job.
      - paragraph [ref=f3e24]: Started in Caracas in 2006, worked my way through Madrid, landed in Barcelona. Eight stops, one language - C# - and a stubborn habit of going back to school at night. I make small games on the weekend and I'm slowly writing down what twenty years taught me.
      - generic [ref=f3e25]:
