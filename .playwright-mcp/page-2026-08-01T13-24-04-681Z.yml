        - generic [ref=f1e30]: EN / ES
    - generic [ref=f1e31]:
      - paragraph [ref=f1e32]: The long run
      - heading "Twenty years, one stop at a time" [level=2] [ref=f1e33]
      - paragraph [ref=f1e34]: Not a straight line, and not supposed to be. Every stop taught me something the next one needed.
      - generic [ref=f1e35]:
        - generic [ref=f1e36]:
          - generic [ref=f1e37]: 2006 - 2012
          - heading ".NET Software Developer" [level=3] [ref=f1e38]
          - generic [ref=f1e39]: WAU · Caracas, Venezuela
          - paragraph [ref=f1e40]: "Six years selling mobile content: carrier integrations, WAP and web apps, and the reporting that proved the subscription numbers were real. First lesson of my career - a system is only as reliable as the integration you don't control."
        - generic [ref=f1e41]:
          - generic [ref=f1e42]: 2013 - 2016
          - heading "Senior Software Engineer" [level=3] [ref=f1e43]
          - generic [ref=f1e44]: Mahisoft · Venezuela / Madrid
          - paragraph [ref=f1e45]: The years I crossed the Atlantic. DocuSign e-signature into ChannelSoft's CMS, and listings work for Homesearch and Ten-x. Two continents in the same standup, which teaches you to write things down.
        - generic [ref=f1e46]:
          - generic [ref=f1e47]: 2016 - 2017
          - heading "Senior Solutions Developer" [level=3] [ref=f1e48]
          - generic [ref=f1e49]: Quodem · Madrid
          - paragraph [ref=f1e50]: A WPF point-of-sale so pharmacists could build their own promotions, and a conferencing platform for doctors running medical congresses. Two domains I knew nothing about, which is the fastest way to learn to ask better questions.
        - generic [ref=f1e51]:
          - generic [ref=f1e52]: 2016 - 2018
          - heading "MSc, Video Game Development with Unity 3D" [level=3] [ref=f1e53]
          - generic [ref=f1e54]: CICE · Madrid
          - paragraph [ref=f1e55]: Evenings and weekends, learning the craft I'd only ever served from the backend. Unity stuck and never left.
        - generic [ref=f1e56]:
          - generic [ref=f1e57]: 2017 - 2019
          - heading "Senior Backend Developer" [level=3] [ref=f1e58]
          - generic [ref=f1e59]: NIIT Technologies · Madrid
          - paragraph [ref=f1e60]: A trips importer for seasonal travel content, and drag-and-drop page modules in Sitecore so content managers stopped filing a ticket every time they wanted to move a block.
        - generic [ref=f1e61]:
          - generic [ref=f1e62]: 2019 - 2021
          - heading "Senior Backend Engineer, then Mobile Developer" [level=3] [ref=f1e63]
          - generic [ref=f1e64]: Cognizant · Madrid
          - paragraph [ref=f1e65]: Tech lead representative for the Madrid backend team on a used-car-lease microservice, then a Xamarin app that let dairy farmers check production across their sites. Different worlds, same DDD habits.
        - generic [ref=f1e66]:
          - generic [ref=f1e67]: 2021 - now
          - heading "Senior Backend Engineer, Online Services" [level=3] [ref=f1e68]
          - generic [ref=f1e69]: Ubisoft · Barcelona
          - paragraph [ref=f1e70]: "Three chapters in five years: an early Ubisoft Connect initiative that never reached production, the Rainbow Six Siege reputation system backend on AWS, and for the last two the Account team - user profiles, authentication, TFA, passkeys, SSO, and account linking with Steam and Blacknut. I don't carry a lead title; I carry the POCs, the spikes and the ADRs."
        - generic [ref=f1e71]:
          - generic [ref=f1e72]: Evenings
          - heading "Novrix Labs" [level=3] [ref=f1e73]
          - generic [ref=f1e74]: My own thing · Okmaya
          - paragraph [ref=f1e75]: Where I build games and tools nobody asked for, which is exactly why they're fun. I model and texture a fair amount of it myself - the art lives on ArtStation and Sketchfab, the builds on itch.io. Knowing how the asset was made changes how you argue about what the backend should carry.
