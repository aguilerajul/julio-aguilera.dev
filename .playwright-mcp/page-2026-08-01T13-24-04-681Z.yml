          - heading "Choosing where data lives" [level=3] [ref=f1e88]
          - paragraph [ref=f1e89]: Access patterns before schemas. Key-value or relational on the merits, hybrid when the honest answer is both, and migrations that finish without a maintenance window.
          - generic [ref=f1e90]: DynamoDB · Aurora · SQL
