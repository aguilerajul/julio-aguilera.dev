          - paragraph [ref=f1e94]: Deploys, rollbacks, and knowing which one to reach for at 3am. Reading logs at volume until the story makes sense, then writing down what happened so it doesn't happen twice.
          - generic [ref=f1e95]: Rollbacks · log forensics · KQL
