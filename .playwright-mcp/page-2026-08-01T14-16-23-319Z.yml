          - generic [ref=e44]: Mahisoft · Venezuela / Madrid
          - paragraph [ref=e45]: The years I crossed the Atlantic. DocuSign e-signature into ChannelSoft's CMS, and listings work for Homesearch and Ten-x. Two continents in the same standup, which teaches you to write things down.
        - generic [ref=e46]:
          - generic [ref=e47]: 2016 - 2017
          - heading "Senior Solutions Developer" [level=3] [ref=e48]
          - generic [ref=e49]: Quodem · Madrid
          - paragraph [ref=e50]: A WPF point-of-sale so pharmacists could build their own promotions, and a conferencing platform for doctors running medical congresses. Two domains I knew nothing about, which is the fastest way to learn to ask better questions.
        - generic [ref=e51]:
          - generic [ref=e52]: 2016 - 2018
          - heading "MSc, Video Game Development with Unity 3D" [level=3] [ref=e53]
          - generic [ref=e54]: CICE · Madrid
          - paragraph [ref=e55]: Evenings and weekends, learning the craft I'd only ever served from the backend. Unity stuck and never left.
        - generic [ref=e56]:
          - generic [ref=e57]: 2017 - 2019
          - heading "Senior Backend Developer" [level=3] [ref=e58]
          - generic [ref=e59]: NIIT Technologies · Madrid
          - paragraph [ref=e60]: A trips importer for seasonal travel content, and drag-and-drop page modules in Sitecore so content managers stopped filing a ticket every time they wanted to move a block.
        - generic [ref=e61]:
          - generic [ref=e62]: 2019 - 2021
          - heading "Senior Backend Engineer, then Mobile Developer" [level=3] [ref=e63]
          - generic [ref=e64]: Cognizant · Madrid
          - paragraph [ref=e65]: Tech lead representative for the Madrid backend team on a used-car-lease microservice, then a Xamarin app that let dairy farmers check production across their sites. Different worlds, same DDD habits.
        - generic [ref=e66]:
          - generic [ref=e67]: 2021 - now
          - heading "Senior Backend Engineer, Online Services" [level=3] [ref=e68]
          - generic [ref=e69]: Ubisoft · Barcelona
          - paragraph [ref=e70]: "Three chapters in five years: an early Ubisoft Connect initiative that never reached production, the Rainbow Six Siege reputation system backend on AWS, and for the last two the Account team - user profiles, authentication, TFA, passkeys, SSO, and account linking with Steam and Blacknut. I don't carry a lead title; I carry the POCs, the spikes and the ADRs."
        - generic [ref=e71]:
          - generic [ref=e72]: Evenings
          - heading "Novrix Labs" [level=3] [ref=e73]
          - generic [ref=e74]: My own thing · Okmaya
          - paragraph [ref=e75]: Where I build games and tools nobody asked for, which is exactly why they're fun. I model and texture a fair amount of it myself - the art lives on ArtStation and Sketchfab, the builds on itch.io. Knowing how the asset was made changes how you argue about what the backend should carry.
