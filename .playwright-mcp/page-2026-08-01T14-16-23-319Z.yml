    - generic [ref=e20]:
      - paragraph [ref=e21]: Barcelona · Backend engineer
      - heading "Hi, I'm Julio. I build the half of the game nobody sees." [level=1] [ref=e22]
      - paragraph [ref=e23]: Twenty years writing backends. These days, the online services behind a live AAA shooter - the accounts, the logins, the data underneath. When it works, nobody notices. That's the job.
      - paragraph [ref=e24]: Started in Caracas in 2006, worked my way through Madrid, landed in Barcelona. Eight stops, one language - C# - and a stubborn habit of going back to school at night. I make small games on the weekend and I'm slowly writing down what twenty years taught me.
