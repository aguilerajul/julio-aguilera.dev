          - generic [ref=e37]: 2006 - 2012
          - heading ".NET Software Developer" [level=3] [ref=e38]
          - generic [ref=e39]: WAU · Caracas, Venezuela
          - paragraph [ref=e40]: "Six years selling mobile content: carrier integrations, WAP and web apps, and the reporting that proved the subscription numbers were real. First lesson of my career - a system is only as reliable as the integration you don't control."
        - generic [ref=e41]:
